<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0866FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FA383E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Reel / Film perforation indicators on left edge -->
  <g fill="#FFFFFF" fill-opacity="0.3">
    <rect x="52" y="90" width="28" height="28" rx="8"/>
    <rect x="52" y="160" width="28" height="28" rx="8"/>
    <rect x="52" y="230" width="28" height="28" rx="8"/>
    <rect x="52" y="300" width="28" height="28" rx="8"/>
    <rect x="52" y="370" width="28" height="28" rx="8"/>
  </g>

  <!-- Play Triangle Graphic -->
  <path d="M190 145 C190 135 202 128 212 134 L310 195 C320 201 320 215 310 221 L212 282 C202 288 190 281 190 271 Z" 
        fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Downward Auto-Scroll Chevrons -->
  <g filter="url(#shadow)">
    <!-- First chevron -->
    <path d="M185 305 L260 365 L335 305" 
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Second chevron -->
    <path d="M205 385 L260 430 L315 385" 
          fill="none" stroke="url(#glowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
